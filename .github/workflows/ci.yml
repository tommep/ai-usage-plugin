name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS build and test
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test
      - name: Validate build script
        run: zsh -n scripts/build-app.sh
      - name: Build application
        run: zsh scripts/build-app.sh
      - name: Validate application bundle
        run: |
          plutil -lint "build/AI Usage.app/Contents/Info.plist"
          codesign --verify --deep --strict "build/AI Usage.app"
          test -s "build/AI Usage.app/Contents/Resources/AppIcon.icns"
          test -s "build/AI Usage.app/Contents/Resources/AIUsage_AIUsage.bundle/Codex.png"
          test -s "build/AI Usage.app/Contents/Resources/AIUsage_AIUsage.bundle/Claude.png"
